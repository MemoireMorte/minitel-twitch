name: minitel-twitch
services:
  minitel-twitch:
    image: ghcr.io/memoiremorte/minitel-twitch:latest
    container_name: minitel-twitch
    environment:
      TWITCH_CHANNEL: ""
      ALERT_DURATION_MS: "4000"
      ALERTS_ENABLED: "true"
      BELL_ENABLED: "true"
    ports:
      - target: 8080
        published: "8080"
        protocol: tcp
    network_mode: bridge
    restart: unless-stopped
    x-casaos:
      envs:
        - container: TWITCH_CHANNEL
          description:
            en_us: Twitch channel name (without #)
        - container: ALERT_DURATION_MS
          description:
            en_us: How long sub/follow alerts stay on screen (ms)
        - container: ALERTS_ENABLED
          description:
            en_us: Show full-screen sub/raid alerts (true/false)
        - container: BELL_ENABLED
          description:
            en_us: Beep the Minitel when an alert shows (true/false)
      ports:
        - container: "8080"
          description:
            en_us: WebSocket port — point the Minitel ESP32 here

x-casaos:
  main: minitel-twitch
  architectures:
    - amd64
    - arm64
  author: MemoireMorte
  developer: MemoireMorte
  title:
    en_us: Minitel Twitch
  tagline:
    en_us: Display Twitch chat on a Minitel terminal
  description:
    en_us: Streams Twitch chat and subscription alerts to a Minitel 1B via its WiFi ESP32 adapter.
  icon: https://raw.githubusercontent.com/MemoireMorte/minitel-twitch/main/icon.svg
  category: Utilities
  scheme: http
  hostname: ""
  index: /
  port_map: "8080"
